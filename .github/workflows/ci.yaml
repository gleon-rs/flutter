# Pull requests: package and example checks on every supported host, plus quality gates (pana,
# publish dry run) on Linux x64. Pushes to main (merged pull requests) rerun only the
# Linux x64 tests: everything else was validated on the pull request's last commit, and the push
# run still uploads main's coverage baseline and metrics.
name: Flutter Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gleon_ref:
        description: >-
          gleon commit (its full SHA) to test against instead of native/gleon_ref (e.g. the head of
          a gleon pull request that changes the C contract), so both sides are checked before
          either merges.
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A cache miss builds gleon-ffi from source first (Windows is the slowest).
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-26.04","target":"linux-x64"}]' || '[{"os":"macos-26","target":"macos-arm64"},{"os":"ubuntu-26.04","target":"linux-x64"},{"os":"ubuntu-26.04-arm","target":"linux-arm64"},{"os":"windows-2025","target":"windows-x64"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          gleon_ref: ${{ inputs.gleon_ref }}
          target: ${{ matrix.target }}

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # Case reports are validated against the committed JSON Schema of the pinned engine
      # (`git -C ../gleon show <pin>:gleon-model/schema/case.v5.json`), and the Dart bindings
      # against the ABI version and struct layout the pinned `gleon-ffi/src/lib.rs` asserts; the
      # tests skip that without the checkout or the commit.
      - name: Check out the gleon schemas and C contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon
          sparse-checkout: |
            gleon-model/schema
            gleon-ffi/src
          persist-credentials: false

      - name: Package
        env:
          COVERAGE: ${{ matrix.target == 'linux-x64' && '--coverage' || '' }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test $COVERAGE

      # Keeps the benchmarks compiling and their verdict checks green; the numbers come from the
      # manual Benchmark workflow on idle runners.
      - name: Benchmark smoke run
        if: ${{ matrix.target == 'linux-x64' }}
        env:
          BENCH_PRESS_ARGS: --validate
        run: flutter test benchmark/

      - name: Example app
        working-directory: flutter/example
        env:
          # Records a case report per golden (see example/.gleon/gleon.yaml): on hosts other than
          # its fallback_platform they compare the macOS goldens with text ignored.
          GLEON_METRICS: "1"
          # On macOS (the fallback_platform) a golden recorded elsewhere would fail: the goldens
          # stay canonical.
          GLEON_REQUIRE_CANONICAL: "1"
          # Stamps the reports of this run, so readers never mix them with another run's
          # (re-runs of failed jobs get their own attempt).
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test

      # Proves the platform-aware goldens: every golden was recorded on macOS (the
      # fallback_platform), which compared them with text, every other host with text ignored (a
      # silent loose comparison on macOS would pass otherwise).
      - name: Check the example's case reports
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # One case per committed golden of the example.
          goldens=$(git ls-files 'example/test/goldens/*.png' | wc -l | tr -d ' ')
          # With none (a moved directory), --min-cases 0 would pass on no reports at all.
          [ "$goldens" -gt 0 ] || { echo "no goldens under example/test/goldens"; exit 1; }
          dart bin/check_cases.dart example/.gleon/runs/latest \
            --fallback-platform macos-aarch64 --min-cases "$goldens" --outcome match \
            --run-id "$GLEON_RUN_ID"

      # Keeps the example's alchemist benchmark compiling and its passes green (numbers: the manual
      # Benchmark workflow).
      - name: Example benchmark smoke run
        if: ${{ matrix.target == 'linux-x64' }}
        working-directory: flutter/example
        env:
          BENCH_PRESS_ARGS: --validate
        run: flutter test benchmark/

      # Also after a failure. The whole run (`cases/` plus the kept candidates and failure
      # images in `artifacts/`) is what `gleon approve --from` reads; kept for a week.
      # Missing reports are an error only when everything passed, so they never add a second
      # error to a failed run.
      - name: Upload metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-${{ matrix.target }}
          path: flutter/example/.gleon/runs/latest/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 7

      - name: Upload coverage
        if: ${{ matrix.target == 'linux-x64' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: flutter/coverage/lcov.info
          flags: flutter
          name: flutter
          verbose: true

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ matrix.target }}
          path: flutter/example/test/failures/
          if-no-files-found: ignore

  consumer:
    name: Consumer ${{ matrix.target }}
    # The package as a consumer meets it (bin/consumer_check.dart): a fresh app with gleon as a
    # dependency without `native/`, no Rust on PATH, the library downloaded by the build hook from
    # a local release (checksums verified), reused offline, then bundled as in the pub.dev
    # archive; no `.gleon/gleon.yaml`, a stray one in the home directory, a golden stamped by
    # `--update-goldens` and its text compared on this platform.
    if: ${{ github.event_name != 'push' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, target: macos-arm64 }
          - { os: ubuntu-26.04, target: linux-x64 }
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      # The library the local release serves (built from the pin, or restored from the cache).
      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          gleon_ref: ${{ inputs.gleon_ref }}
          target: ${{ matrix.target }}

      - name: Consumer check
        run: |
          flutter pub get
          dart bin/consumer_check.dart --target ${{ matrix.target }} --stray-home-config

  cli:
    name: gleon CLI on the example
    # The case reports of a Flutter run read by the gleon CLI of the pinned commit: the contract
    # between this package (the writer) and the CLI (the reader), end to end.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          gleon_ref: ${{ inputs.gleon_ref }}
          target: linux-x64

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # One build per pinned commit, like the native library.
      - name: Restore the gleon CLI
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gleon-cli/target/release/gleon
          key: gleon-cli-linux-x64-${{ steps.pin.outputs.gleon_ref }}

      - name: Check out gleon
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon-cli
          persist-credentials: false

      # Rustup from a pinned action (never a downloaded installer script), even when the native
      # library came from the cache and nothing installed Rust yet.
      - name: Set up Rust
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: gleon-cli
          cache: false
          build-warnings: warn

      - name: Build the gleon CLI
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        working-directory: gleon-cli
        run: |
          rustup toolchain install
          cargo build --release --locked -p gleon

      - name: Put the gleon CLI on PATH
        run: echo "$GITHUB_WORKSPACE/gleon-cli/target/release" >> "$GITHUB_PATH"

      - name: Report the example's run
        working-directory: flutter/example
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter pub get
          mkdir -p build/gleon
          gleon test -- flutter test 2>&1 | tee build/gleon/test.log
          # The run is summed up at its end: every case passed.
          grep -Eq 'case\(s\): [1-9][0-9]* passed, 0 failed' build/gleon/test.log
          gleon report markdown
          gleon report junit --out build/gleon/junit.xml
          gleon report html --out build/gleon/report.html
          test -s build/gleon/report.html
          gleon dashboard --out build/gleon/dashboard.html
          # Every golden of the example was read, and none failed.
          grep -Eq 'tests="[1-9][0-9]*" failures="0" errors="0"' build/gleon/junit.xml
          # `baselines: goldens`: the commands that scan screenshots refuse and point to `gleon test`.
          if gleon status 2> build/gleon/status.log; then
            echo "::error::gleon status should refuse a goldens workspace"; exit 1
          fi
          grep -q 'gleon test --' build/gleon/status.log
          # The approve loop: a golden that no longer matches fails the run, `gleon approve`
          # writes the candidate over it (stamped with this platform), the next run passes.
          cp test/goldens/counter_three_taps.png test/goldens/counter_initial.png
          if gleon test -- flutter test > build/gleon/broken.log 2>&1; then
            echo "::error::a golden replaced by another image should fail"; exit 1
          fi
          grep -Eq 'case\(s\): [0-9]+ passed, 1 failed \(1 mismatch\)' build/gleon/broken.log
          gleon approve 2>&1 | tee build/gleon/approve.log
          grep -q 'Approved 1 ' build/gleon/approve.log
          grep -q 'gleon:platform' test/goldens/counter_initial.png
          gleon test -- flutter test 2>&1 | tee build/gleon/fixed.log
          grep -Eq 'case\(s\): [1-9][0-9]* passed, 0 failed' build/gleon/fixed.log

  quality:
    name: Quality gates
    # Validated on the pull request; a merge to main does not change the result.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned like Flutter itself, so a tool release never changes results on its own.
      PANA_VERSION: "0.23.19"
      # Points pana may lose (out of 160): none, 160/160 since main publishes (no `publish_to`).
      PANA_MAX_LOST_POINTS: "0"
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      # Nothing here runs the build hook, so the native library is not needed.
      - name: Set up Flutter
        uses: ./flutter/.github/actions/setup
        with:
          gleon_ref: ${{ inputs.gleon_ref }}
          target: linux-x64
          build: "false"

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # NATIVE_LICENSES.md must list the crates the pinned gleon-ffi links.
      - name: Check out gleon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: gleon
          cache: false
          build-warnings: warn

      - name: Native licenses
        run: |
          (cd ../gleon && rustup toolchain install)
          dart bin/native_licenses.dart --gleon-repo ../gleon --check

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: pana
        run: |
          dart pub global activate pana "$PANA_VERSION"
          dart pub global run pana . --no-warning --flutter-sdk "$FLUTTER_ROOT" \
            --exit-code-threshold "$PANA_MAX_LOST_POINTS"
