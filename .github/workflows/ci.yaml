name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x64 }
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Package
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Example app
        working-directory: flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures-${{ matrix.target }}
          path: |
            flutter/test/failures/
            flutter/example/test/failures/
          if-no-files-found: ignore
