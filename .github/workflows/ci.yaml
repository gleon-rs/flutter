# Pull requests: package and example checks on every supported host, plus quality gates (pana,
# publish dry run) on Linux x64. Pushes to main (merged pull requests) rerun only the
# Linux x64 tests: everything else was validated on the pull request's last commit, and the push
# run still uploads main's coverage baseline and metrics.
name: Flutter Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A cache miss builds gleon-ffi from source first (Windows is the slowest).
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-26.04","target":"linux-x64"}]' || '[{"os":"macos-15","target":"macos-arm64"},{"os":"ubuntu-26.04","target":"linux-x64"},{"os":"ubuntu-26.04-arm","target":"linux-arm64"},{"os":"windows-2025","target":"windows-x64"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # Case reports are validated against the committed JSON Schema of the pinned engine
      # (`../gleon/gleon-model/schema/case.v2.json`); the tests skip that without the checkout.
      - name: Check out the gleon schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon
          sparse-checkout: gleon-model/schema
          persist-credentials: false

      - name: Package
        env:
          COVERAGE: ${{ matrix.target == 'linux-x64' && '--coverage' || '' }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test $COVERAGE

      # Keeps the benchmarks compiling and their verdict checks green; the numbers come from the
      # manual Benchmark workflow on idle runners.
      - name: Benchmark smoke run
        if: ${{ matrix.target == 'linux-x64' }}
        env:
          BENCH_PRESS_ARGS: --validate
        run: flutter test benchmark/

      - name: Example app
        working-directory: flutter/example
        env:
          # Records a case report per golden (see example/.gleon/gleon.yaml): the cross-OS
          # corpus for calibrating tolerances and text-aware comparison.
          GLEON_METRICS: "1"
          # Stamps the reports of this run, so readers never mix them with another run's
          # (re-runs of failed jobs get their own attempt).
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test

      # Also after a failure: mismatches are the most useful calibration data. The whole run
      # (`cases/` plus the failure images in `artifacts/`) is what `gleon approve --from` reads.
      # Missing reports are an error only when everything passed, so they never add a second
      # error to a failed run.
      - name: Upload metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics-${{ matrix.target }}
          path: flutter/example/.gleon/runs/latest/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

      - name: Upload coverage
        if: ${{ matrix.target == 'linux-x64' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: flutter/coverage/lcov.info
          flags: flutter
          name: flutter
          override_branch: ${{ github.base_ref }}
          verbose: true

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures-${{ matrix.target }}
          path: flutter/example/test/failures/
          if-no-files-found: ignore

  cli:
    name: gleon CLI on the example
    # The case reports of a Flutter run read by the gleon CLI of the pinned commit: the contract
    # between this package (the writer) and the CLI (the reader), end to end.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          target: linux-x64

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # One build per pinned commit, like the native library.
      - name: Restore the gleon CLI
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gleon-cli/target/release/gleon
          key: gleon-cli-linux-x64-${{ steps.pin.outputs.gleon_ref }}

      - name: Check out gleon
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon-cli
          persist-credentials: false

      - name: Build the gleon CLI
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        working-directory: gleon-cli
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          cargo build --release --locked -p gleon

      - name: Put the gleon CLI on PATH
        run: echo "$GITHUB_WORKSPACE/gleon-cli/target/release" >> "$GITHUB_PATH"

      - name: Report the example's run
        working-directory: flutter/example
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter pub get
          gleon test -- flutter test
          gleon report markdown
          gleon report junit --out build/gleon/junit.xml
          gleon dashboard --out build/gleon/dashboard.html
          # Every golden of the example was read, and none failed.
          grep -Eq 'tests="[1-9][0-9]*" failures="0" errors="0"' build/gleon/junit.xml

  quality:
    name: Quality gates
    # Validated on the pull request; a merge to main does not change the result.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned like Flutter itself, so a tool release never changes results on its own.
      PANA_VERSION: "0.23.19"
      # Points pana may lose (out of 160); locally 150/160. The 10 lost points are the
      # repository check: pana clones the default branch, which still has `publish_to: none`.
      # TODO(owner): set to "0" once that is merged and the first CI run confirms 160.
      PANA_MAX_LOST_POINTS: "10"
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      # Nothing here runs the build hook, so the native library is not needed.
      - name: Set up Flutter
        uses: ./flutter/.github/actions/setup
        with:
          target: linux-x64
          build: "false"

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: pana
        run: |
          dart pub global activate pana "$PANA_VERSION"
          dart pub global run pana . --no-warning --flutter-sdk "$FLUTTER_ROOT" \
            --exit-code-threshold "$PANA_MAX_LOST_POINTS"
