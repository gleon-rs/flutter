# Pull requests: package and example checks on every supported host, plus quality gates (pana,
# publish dry run) on Linux x64. Pushes to main (merged pull requests) rerun only the
# Linux x64 tests: everything else was validated on the pull request's last commit, and the push
# run still uploads main's coverage baseline and metrics.
name: Flutter Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gleon_ref:
        description: >-
          gleon commit to test against instead of native/gleon_ref (e.g. the head of a gleon pull
          request that changes the C contract), so both sides are checked before either merges.
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A cache miss builds gleon-ffi from source first (Windows is the slowest).
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-26.04","target":"linux-x64"}]' || '[{"os":"macos-15","target":"macos-arm64"},{"os":"ubuntu-26.04","target":"linux-x64"},{"os":"ubuntu-26.04-arm","target":"linux-arm64"},{"os":"windows-2025","target":"windows-x64"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Pin the requested gleon commit
        if: ${{ inputs.gleon_ref != '' }}
        env:
          GLEON_REF: ${{ inputs.gleon_ref }}
        run: printf '%s\n' "$GLEON_REF" > native/gleon_ref

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # Case reports are validated against the committed JSON Schema of the pinned engine
      # (`git -C ../gleon show <pin>:gleon-model/schema/case.v3.json`), and the Dart bindings
      # against the ABI version and struct layout the pinned `gleon-ffi/src/lib.rs` asserts; the
      # tests skip that without the checkout or the commit.
      - name: Check out the gleon schemas and C contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon
          sparse-checkout: |
            gleon-model/schema
            gleon-ffi/src
          persist-credentials: false

      - name: Package
        env:
          COVERAGE: ${{ matrix.target == 'linux-x64' && '--coverage' || '' }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test $COVERAGE

      # Keeps the benchmarks compiling and their verdict checks green; the numbers come from the
      # manual Benchmark workflow on idle runners.
      - name: Benchmark smoke run
        if: ${{ matrix.target == 'linux-x64' }}
        env:
          BENCH_PRESS_ARGS: --validate
        run: flutter test benchmark/

      - name: Example app
        working-directory: flutter/example
        env:
          # Records a case report per golden (see example/.gleon/gleon.yaml): on hosts other than
          # its fallback_platform they compare the macOS goldens with text ignored.
          GLEON_METRICS: "1"
          # Stamps the reports of this run, so readers never mix them with another run's
          # (re-runs of failed jobs get their own attempt).
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test

      # Proves the platform-aware goldens: macOS compared its own goldens with text, every other
      # host fell back to them (a silent fallback to one shared golden would pass otherwise).
      - name: Check the example's case reports
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          dart bin/check_cases.dart example/.gleon/runs/latest \
            --fallback-platform macos-aarch64 --min-cases 2 --outcome match --run-id "$GLEON_RUN_ID"

      # Also after a failure. The whole run (`cases/` plus the kept candidates and failure
      # images in `artifacts/`) is what `gleon approve --from` reads; kept for a week.
      # Missing reports are an error only when everything passed, so they never add a second
      # error to a failed run.
      - name: Upload metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics-${{ matrix.target }}
          path: flutter/example/.gleon/runs/latest/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 7

      - name: Upload coverage
        if: ${{ matrix.target == 'linux-x64' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: flutter/coverage/lcov.info
          flags: flutter
          name: flutter
          override_branch: ${{ github.base_ref }}
          verbose: true

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures-${{ matrix.target }}
          path: flutter/example/test/failures/
          if-no-files-found: ignore

  cli:
    name: gleon CLI on the example
    # The case reports of a Flutter run read by the gleon CLI of the pinned commit: the contract
    # between this package (the writer) and the CLI (the reader), end to end.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          target: linux-x64

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # One build per pinned commit, like the native library.
      - name: Restore the gleon CLI
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gleon-cli/target/release/gleon
          key: gleon-cli-linux-x64-${{ steps.pin.outputs.gleon_ref }}

      - name: Check out gleon
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon-cli
          persist-credentials: false

      # Rustup from a pinned action (never a downloaded installer script), even when the native
      # library came from the cache and nothing installed Rust yet.
      - name: Set up Rust
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: gleon-cli
          cache: false
          build-warnings: warn

      - name: Build the gleon CLI
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        working-directory: gleon-cli
        run: |
          rustup toolchain install
          cargo build --release --locked -p gleon

      - name: Put the gleon CLI on PATH
        run: echo "$GITHUB_WORKSPACE/gleon-cli/target/release" >> "$GITHUB_PATH"

      - name: Report the example's run
        working-directory: flutter/example
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter pub get
          gleon test -- flutter test
          gleon report markdown
          gleon report junit --out build/gleon/junit.xml
          gleon dashboard --out build/gleon/dashboard.html
          # Every golden of the example was read, and none failed.
          grep -Eq 'tests="[1-9][0-9]*" failures="0" errors="0"' build/gleon/junit.xml

      # The per-platform loop end to end: this host fell back to the macOS goldens, so
      # `gleon approve` records its own goldens from the run, and the next run compares them.
      - name: Approve this platform's goldens and compare with them
        working-directory: flutter/example
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gleon approve
          test -f test/goldens/linux-x86_64/counter_initial.png
          test -f test/goldens/linux-x86_64/counter_three_taps.png
          GLEON_RUN_ID="$GLEON_RUN_ID-own" gleon test -- flutter test

      - name: Check the rerun compared the own goldens
        env:
          GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-own
        run: |
          dart bin/check_cases.dart example/.gleon/runs/latest \
            --own --min-cases 2 --outcome match --run-id "$GLEON_RUN_ID"

  quality:
    name: Quality gates
    # Validated on the pull request; a merge to main does not change the result.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned like Flutter itself, so a tool release never changes results on its own.
      PANA_VERSION: "0.23.19"
      # Points pana may lose (out of 160); locally 150/160. The 10 lost points are the
      # repository check: pana clones the default branch, which still has `publish_to: none`.
      # TODO(owner): set to "0" once that is merged and the first CI run confirms 160.
      PANA_MAX_LOST_POINTS: "10"
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      # Nothing here runs the build hook, so the native library is not needed.
      - name: Set up Flutter
        uses: ./flutter/.github/actions/setup
        with:
          target: linux-x64
          build: "false"

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Read the gleon pin
        id: pin
        run: echo "gleon_ref=$(tr -d '[:space:]' < native/gleon_ref)" >> "$GITHUB_OUTPUT"

      # NATIVE_LICENSES.md must list the crates the pinned gleon-ffi links.
      - name: Check out gleon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gleon-rs/gleon
          ref: ${{ steps.pin.outputs.gleon_ref }}
          path: gleon
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: gleon
          cache: false
          build-warnings: warn

      - name: Native licenses
        run: |
          (cd ../gleon && rustup toolchain install)
          dart bin/native_licenses.dart --gleon-repo ../gleon --check

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: pana
        run: |
          dart pub global activate pana "$PANA_VERSION"
          dart pub global run pana . --no-warning --flutter-sdk "$FLUTTER_ROOT" \
            --exit-code-threshold "$PANA_MAX_LOST_POINTS"
