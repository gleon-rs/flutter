# Push a tag `vX.Y.Z` equal to `version` in pubspec.yaml to release. Every target is built
# natively from the gleon commit in native/gleon_ref, tested on its own OS, attested, and attached
# to an immutable GitHub Release (enable "release immutability" in the repository settings), which
# the build hook downloads from. A later job will also `dart pub publish` with the libraries
# bundled (pub.dev OIDC requires exactly this kind of tag-push trigger).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a half-published release.
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match pubspec version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | sed 's/#.*//' | tr -d "\"' ")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    # Always a fresh gleon-ffi build (no cache), then the tests.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x64 }
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false

      - name: Set up Flutter and build gleon-ffi
        uses: ./flutter/.github/actions/setup
        with:
          target: ${{ matrix.target }}
          cache: "false"
          dist: ${{ github.workspace }}/dist

      - name: Test with the fresh library
        run: |
          flutter analyze --fatal-infos
          flutter test
          cd example
          flutter pub get
          flutter test

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Assets go onto a draft first: an immutable release rejects uploads once published.
      - name: Create and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false

  verify:
    name: Verify download ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x64 }
    defaults:
      run:
        shell: bash
        working-directory: flutter/example
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flutter
          persist-credentials: false
      - name: Set up Flutter only
        uses: ./flutter/.github/actions/setup
        with:
          target: ${{ matrix.target }}
          build: "false"
      # No native/<target> exists, so the hook downloads and verifies the release asset.
      - name: Example tests against the published release
        run: |
          test ! -e ../native/${{ matrix.target }}
          flutter pub get
          flutter test
