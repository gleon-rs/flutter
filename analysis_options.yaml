# Rule of the house: every disabled or narrowed rule states its reason.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - dist/**
    - example/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Info
    always_declare_return_types: info
    directives_ordering: info
    todo: info

    # Warning
    empty_catches: warning
    prefer_relative_imports: warning

    # Error
    avoid_relative_lib_imports: error
    avoid_slow_async_io: error
    avoid_types_as_parameter_names: error
    cancel_subscriptions: error
    close_sinks: error
    valid_regexps: error

dart_code_metrics:
  # `flutter_all` only lists Flutter-specific rules, so both presets are needed.
  extends:
    - package:dart_code_metrics_presets/dart_all.yaml
    - package:dart_code_metrics_presets/flutter_all.yaml
    - package:dart_code_metrics_presets/pub.yaml
  exclude:
    metrics:
      - "example/**"
      - "test/**"
      - "bin/**"
      - "benchmark/**"
  metrics:
    number-of-overridden-methods:
      threshold: 10

  pubspec-rules:
    # Disabled:
    - add-resolution-workspace: false # Not a monorepo: one package + its example.
    - prefer-pinned-version-syntax: false # Conflicts with prefer-caret-version-syntax.
    - prefer-publish-to-none: false # A published package (pub.dev is planned).

    # Enabled:
    - avoid-any-version: true
    - avoid-dependency-overrides: true
    - dependencies-ordering: true
    - newline-before-pubspec-entry: true
    - prefer-caret-version-syntax: true
    - prefer-commenting-pubspec-ignores: true
    - prefer-correct-package-name: true
    - prefer-correct-screenshots: true
    - prefer-correct-topics: true
    - prefer-semver-version: true
    - pubspec-ordering: true

  rules:
    # With configs:
    - avoid-banned-imports:
        entries:
          - paths: ["lib/src/core/.*"]
            deny: ["package:flutter/.*", "package:flutter_test/.*", "dart:ui"]
            message: "lib/src/core/ is plain Dart; Flutter code goes to lib/src/flutter/."
    - arguments-ordering:
        last: # Agrees with the sort_child_properties_last lint.
          - child
          - children
    - avoid-high-cyclomatic-complexity:
        threshold: 40
    - avoid-long-functions:
        exclude:
          - "**/*_test.dart" # A test body reads top to bottom; splitting hides it.
    - avoid-long-parameter-list:
        ignore-optional: true
    - avoid-nested-conditional-expressions:
        acceptable-level: 2
    - avoid-passing-async-when-sync-expected:
        exclude:
          - test/** # testWidgets/runAsync callbacks are async by design.
    - avoid-passing-self-as-argument:
        exclude:
          - test/** # expect(value, matcherOf(value)) is a common test shape.
    - avoid-redundant-async:
        exclude:
          - test/** # Test callbacks stay async for uniformity.
    - avoid-returning-widgets:
        allow-nullable: true
    - avoid-similar-names:
        similarity-threshold: 0.8
        ignored-names:
          - path
    - avoid-top-level-members-in-tests:
        exclude:
          - lib/**
          - test/helpers/** # Shared widgets and fixtures of the test suite.
    - format-comment:
        ignored-patterns:
          - ^coverage.* # `// coverage:ignore-*` markers are not sentences.
    - max-statements:
        exclude:
          - "**/*_test.dart" # Arrange/act/assert in one test body.
    - member-ordering:
        order:
          - constructors
          - public-fields
          - private-fields
    - missing-test-assertion:
        include-assertions:
          - expectLater
          - expectValueSemantics # test/helpers/value_semantics.dart
          - expectMatchesCaseSchema # test/helpers/workspace_sandbox.dart
    - prefer-class-destructuring:
        min-occurrences: 4
    - prefer-correct-identifier-length:
        # i for index, x/y for coordinates, a/b for comparisons, e for the
        # element, k/v for key/value, io for IO, os for operating system, sb
        # for StringBuffer.
        exceptions: ["a", "b", "e", "i", "k", "v", "x", "y", "io", "os", "sb"]
    - prefer-named-parameters:
        max-number: 3
        exclude:
          - lib/src/core/native/** # `@Native` functions mirror the C ABI.
    - prefer-single-declaration-per-file:
        exclude:
          - "**/test/**" # Private painters live next to the widgets using them.
    - prefer-static-class:
        exclude:
          - test/**
          - benchmark/** # Scripts: `main` plus private helpers.
          - bin/** # Scripts: `main` plus private helpers.
          - hook/** # Scripts: `main` plus private helpers.
    - prefer-typedefs-for-callbacks:
        exclude:
          - lib/src/core/native/** # `@Native<...>` signatures are the C ABI.
        ignore-fields: true
        ignore-parameters: true
        ignore-type-arguments: false
        ignore-return-types: false
    - prefer-widget-private-members:
        ignore-static: true

    # Relaxed in tests only:
    - avoid-async-call-in-sync-function:
        exclude:
          - benchmark/** # bench_press awaits the futures its variants return.
    - avoid-collection-mutating-methods:
        exclude:
          - test/** # Fixtures (a mirror whose files change) are mutable.
    - avoid-duplicate-collection-elements:
        exclude:
          - test/** # Test data repeats values (image sizes, bytes).
    - avoid-duplicate-initializers:
        exclude:
          - test/** # Calling the same thing twice is what cache tests do.
    - avoid-local-functions:
        exclude:
          - test/** # Fixtures read best next to the tests using them.
    - avoid-non-ascii-symbols:
        exclude:
          - test/** # Tests assert on the exact failure text ("≤", "±").
    - prefer-match-file-name:
        exclude:
          - benchmark/** # Named after what they measure.
          - test/** # Test files are named after behavior; fakes are private.
    - prefer-moving-to-variable:
        exclude:
          - test/** # Repeated calls are the subject of the test.
    - prefer-redirecting-superclass-constructor:
        exclude:
          - test/** # Tests compare factories with the constructors on purpose.

    # Disabled:
    - avoid-adjacent-strings: false # Long messages wrap as adjacent strings (Effective Dart); `+` is banned by prefer_adjacent_string_concatenation.
    - avoid-ignoring-return-values: false # dart:io create/rename/delete return the entity itself.
    - avoid-inferrable-type-arguments: false # Conflicts with prefer-explicit-type-arguments.
    - avoid-referencing-subclasses: false # Sealed families name their own variants.
    - avoid-throw: false # Actionable errors are the API of the hook and matcher.
    - no-magic-number: false # Tolerances, limits and FFI sizes are numbers.
    - no-magic-string: false # Error messages and JSON keys are strings.
    - parameters-ordering: false # Order follows meaning (x, y, width, height; baseline, candidate).
    - prefer-correct-throws: false # No DCM `@Throws` annotations (extra dependency).
    - prefer-prefixed-global-constants: false # Effective Dart: no prefix letters (`k`).
    - prefer-test-matchers: false # Matter of style + introduces coupling in tests.
    - prefer-test-structure: false # Matter of style.

    # Enabled (beyond the presets):
    - avoid-banned-exports: true
    - avoid-continue: true
    - match-lib-folder-structure: true
    - max-imports: true
    - no-equal-arguments: true
    - pass-correct-accepted-type: true
    - pass-optional-argument: true
    - prefer-both-inlining-annotations: true
    - prefer-compute-over-isolate-run: true
    - prefer-correct-mutated: true
    - prefer-explicit-parameter-names: true
    - prefer-private-named-parameters: true
    - prefer-unmodifiable-of: true
    - use-existing-widget: true

linter:
  rules:
    # Disabled:
    always_put_control_body_on_new_line: false # Makes code harder to read.
    always_specify_types: false # Conflicts with: omit_local_variable_types.
    always_use_package_imports: false # Conflicts with: prefer_relative_imports.
    avoid_classes_with_only_static_members: false # Conflicts with: prefer-static-class
    flutter_style_todos: false # Not a Flutter team.
    omit_local_variable_types: false # Conflicts with: prefer-type-over-var
    omit_obvious_local_variable_types: false # Conflicts with: omit_local_variable_types and prefer-type-over-var.
    omit_obvious_property_types: false # Conflicts with: type_annotate_public_apis.
    prefer_double_quotes: false # Conflicts with: prefer_single_quotes.
    specify_nonobvious_local_variable_types: false # Conflicts with: avoid-explicit-type-declaration.
    unnecessary_final: false # Conflicts with: prefer_final_locals.
    # Primary constructors, `new`/`factory` constructor names and `;` class
    # bodies (Dart 3.13) stay off for now: `dart fix` misplaces field docs
    # when converting, and pana bundles an older analyzer. Revisit
    # with the next tooling bump.
    empty_container_bodies: false
    unnecessary_type_name_in_constructor: false
    use_primary_constructors: false

    # Enabled:
    always_declare_return_types: true
    always_put_required_named_parameters_first: true
    annotate_overrides: true
    annotate_redeclares: true
    async_return_with_no_await: true
    avoid_annotating_with_dynamic: true
    avoid_bool_literals_in_conditional_expressions: true
    avoid_catches_without_on_clauses: true
    avoid_catching_errors: true
    avoid_double_and_int_checks: true
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    avoid_escaping_inner_quotes: true
    avoid_field_initializers_in_const_classes: true
    avoid_final_parameters: true
    avoid_function_literals_in_foreach_calls: true
    avoid_futureor_void: true
    avoid_implementing_value_types: true
    avoid_init_to_null: true
    avoid_js_rounded_ints: true
    avoid_multiple_declarations_per_line: true
    avoid_positional_boolean_parameters: true
    avoid_print: true
    avoid_redundant_argument_values: true
    avoid_relative_lib_imports: true
    avoid_renaming_method_parameters: true
    avoid_return_types_on_setters: true
    avoid_returning_null_for_void: true
    avoid_returning_this: true
    avoid_setters_without_getters: true
    avoid_shadowing_type_parameters: true
    avoid_single_cascade_in_expression_statements: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    avoid_types_as_parameter_names: true
    avoid_types_on_closure_parameters: true
    avoid_unnecessary_containers: true
    avoid_unused_constructor_parameters: true
    avoid_void_async: true
    avoid_web_libraries_in_flutter: true
    await_only_futures: true
    camel_case_extensions: true
    camel_case_types: true
    cancel_subscriptions: true
    cascade_invocations: true
    cast_nullable_to_non_nullable: true
    close_sinks: true
    collection_methods_unrelated_type: true
    combinators_ordering: true
    comment_references: true
    conditional_uri_does_not_exist: true
    constant_identifier_names: true
    control_flow_in_finally: true
    curly_braces_in_flow_control_structures: true
    dangling_library_doc_comments: true
    depend_on_referenced_packages: true
    deprecated_consistency: true
    deprecated_member_use_from_same_package: true
    diagnostic_describe_all_properties: true
    directives_ordering: true
    discarded_futures: true
    do_not_use_environment: true
    document_ignores: true
    empty_catches: true
    empty_constructor_bodies: true
    empty_statements: true
    eol_at_end_of_file: true
    exhaustive_cases: true
    file_names: true
    hash_and_equals: true
    implementation_imports: true
    implicit_call_tearoffs: true
    implicit_reopen: true
    initialize_in_field_declaration: true
    invalid_case_patterns: true
    invalid_runtime_check_with_js_interop_types: true
    join_return_with_assignment: true
    leading_newlines_in_multiline_strings: true
    library_annotations: true
    library_names: true
    library_prefixes: true
    library_private_types_in_public_api: true
    lines_longer_than_80_chars: true
    literal_only_boolean_expressions: true
    matching_super_parameters: true
    migrate_design_widgets: true
    missing_code_block_language_in_doc_comment: true
    missing_whitespace_between_adjacent_strings: true
    no_adjacent_strings_in_list: true
    no_default_cases: true
    no_duplicate_case_values: true
    no_dynamic_casts: true
    no_leading_underscores_for_library_prefixes: true
    no_leading_underscores_for_local_identifiers: true
    no_literal_bool_comparisons: true
    no_logic_in_create_state: true
    no_raw_types: true
    no_runtimeType_toString: true
    no_self_assignments: true
    no_wildcard_variable_uses: true
    non_constant_identifier_names: true
    noop_primitive_operations: true
    null_check_on_nullable_type_parameter: true
    null_closures: true
    only_throw_errors: true
    overridden_fields: true
    package_names: true
    package_prefixed_library_names: true
    parameter_assignments: true
    prefer_adjacent_string_concatenation: true
    prefer_asserts_in_initializer_lists: true
    prefer_asserts_with_message: true
    prefer_collection_literals: true
    prefer_conditional_assignment: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_constructors_over_static_methods: true
    prefer_contains: true
    prefer_expression_function_bodies: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    prefer_for_elements_to_map_fromIterable: true
    prefer_foreach: true
    prefer_function_declarations_over_variables: true
    prefer_generic_function_type_aliases: true
    prefer_if_elements_to_conditional_expressions: true
    prefer_if_null_operators: true
    prefer_initializing_formals: true
    prefer_inlined_adds: true
    prefer_int_literals: true
    prefer_interpolation_to_compose_strings: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    prefer_is_not_operator: true
    prefer_iterable_whereType: true
    prefer_mixin: true
    prefer_null_aware_method_calls: true
    prefer_null_aware_operators: true
    prefer_relative_imports: true
    prefer_single_quotes: true
    prefer_spread_collections: true
    prefer_typing_uninitialized_variables: true
    prefer_void_to_null: true
    provide_deprecation_message: true
