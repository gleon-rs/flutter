# gleon workspace config: the same file the gleon CLI reads (`gleon init`).
# The gleon Flutter package applies these rules to `matchesGoldenFile` calls
# that pass no `tolerance`.
required_version: ">=0.1.0"

# The goldens next to the tests are the baselines (what `gleon init` writes for
# Flutter): the CLI reads the case reports of `gleon test -- flutter test`
# instead of scanning the goldens as screenshots.
baselines: goldens

# The goldens in test/goldens/ are recorded on an Apple silicon Mac (see
# "Real text" in the package README).
fallback_platform: macos-aarch64

screenshots:
  - include: "test/goldens/**/*.png"
    # Everything but text must match exactly: the tests load the app's real
    # fonts (`loadAppFonts` in test/flutter_test_config.dart).
    mode: exact

# Per-golden case reports in .gleon/runs/latest/cases/<platform>/; CI turns them
# on with GLEON_METRICS=1.
metrics:
  enabled: false
