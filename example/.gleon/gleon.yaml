# gleon workspace config: the same file the gleon CLI reads (`gleon init`).
# The gleon Flutter package applies these rules to `matchesGoldenFile` calls
# that pass no `tolerance`.
required_version: ">=0.1.0"

screenshots:
  - include: "test/goldens/**/*.png"
    # Everything but text must match exactly: the tests load the app's real
    # fonts (`loadAppFonts` in test/flutter_test_config.dart), and the goldens
    # are recorded on macOS. Text never fails by default (`text_tolerance: 1`):
    # other operating systems rasterize glyphs differently, by more than a
    # changed digit differs, so one golden for every OS cannot compare text.
    # A changed counter still fails when it changes the layout; exact text on
    # every OS needs per-platform goldens.
    mode: pixel
    diff:
      threshold: 0

# Per-golden case reports in .gleon/runs/latest/cases/; CI turns them on with
# GLEON_METRICS=1.
metrics:
  enabled: false
