# The package's configuration, relaxed like sealed_world's examples: an app
# is not a library, so API docs are not required.
include: ../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - linux/**
    - macos/**
    - windows/**

dart_code_metrics:
  rules:
    - prefer-localized-semantic-labels: false # The example is not localized.

linter:
  rules:
    public_member_api_docs: false # An app, not a library.
