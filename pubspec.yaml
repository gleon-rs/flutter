name: gleon
description: Drop-in matchesGoldenFile for Flutter golden tests, 5-20x faster, with pixel and SSIM tolerance, ignore regions and real fonts, powered by a Rust engine.
version: 0.6.0
repository: https://github.com/gleon-rs/flutter
issue_tracker: https://github.com/gleon-rs/flutter/issues

topics:
  - testing
  - golden-test
  - visual-regression
  - ssim
  - flutter-test

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Runtime dependencies are only what the build hook and the re-exported
# flutter_test need; the hook runs in the consumer's package graph.
dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  hooks: ^2.2.0
  meta: ^1.19.0
  # flutter_test pins one exact 0.x of test_api per SDK release; `TestHandle`
  # (test names for metrics) comes from here. A caret would refuse the next
  # minor and break `pub get` for every consumer until a release of gleon.
  # ignore: prefer-caret-version-syntax, flutter_test pins one exact 0.x per SDK release; a caret breaks pub get on the next minor.
  test_api: ">=0.7.0 <1.0.0"

dev_dependencies:
  bench_press: ^0.4.2
  dart_code_metrics_presets: ^2.34.0
  flutter_lints: ^6.0.0
  json_schema: ^5.2.2
  material_ui: ^1.11.0 # Material's TextField in test/text/real_text_test.dart.
