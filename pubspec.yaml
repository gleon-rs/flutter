name: gleon
description: Drop-in matchesGoldenFile for Flutter golden tests, 5-20x faster, with pixel and SSIM tolerance, ignore regions and real fonts, powered by a Rust engine.
version: 0.6.1
homepage: https://gleon.rs
repository: https://github.com/gleon-rs/flutter
issue_tracker: https://github.com/gleon-rs/flutter/issues

# The hosts `flutter test` runs on with the native library (README "Known
# limitations": no web, no on-device tests).
platforms:
  linux:
  macos:
  windows:

topics:
  - testing
  - golden-test
  - visual-regression
  - ssim
  - flutter-test

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Runtime dependencies are only what the build hook and the re-exported
# flutter_test need; the hook runs in the consumer's package graph.
dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  hooks: ^2.2.0
  meta: ^1.19.0
  test_api: ^0.7.14

dev_dependencies:
  bench_press: ^0.4.2
  dart_code_metrics_presets: ^2.34.0
  flutter_lints: ^6.0.0
  json_schema: ^5.2.2
  material_ui: ^1.11.0 # Material's TextField in test/text/real_text_test.dart.

# Source: og/pub-dev.html of the site repository (gleon-rs.github.io).
screenshots:
  - description: Time per golden, flutter_test and gleon, and the line coverage of the package.
    path: doc/screenshot.webp
